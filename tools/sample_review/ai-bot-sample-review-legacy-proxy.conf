location = /sample-review {
    return 301 /sample-review/;
}

location /sample-review/ {
    auth_basic "AI sample review";
    auth_basic_user_file /etc/nginx/.htpasswd-ai-bot-sample-review;

    proxy_pass https://card.goods-editor.com/;
    proxy_http_version 1.1;
    proxy_set_header Host card.goods-editor.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
    proxy_ssl_name card.goods-editor.com;
    proxy_read_timeout 120s;
}
