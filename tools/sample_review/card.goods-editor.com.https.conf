server {
    listen 80;
    server_name card.goods-editor.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 302 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name card.goods-editor.com;

    ssl_certificate /etc/letsencrypt/live/card.goods-editor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/card.goods-editor.com/privkey.pem;

    client_max_body_size 100m;

    location / {
        auth_basic "AI sample review";
        auth_basic_user_file /etc/nginx/.htpasswd-ai-bot-sample-review;

        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 8792;
    server_name _;

    allow 1.12.246.48;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
