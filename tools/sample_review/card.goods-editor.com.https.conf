server {
    listen 80;
    listen [::]:80;
    server_name card.goods-editor.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/card-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name card.goods-editor.com;

    ssl_certificate /etc/letsencrypt/live/card.goods-editor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/card.goods-editor.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;
    proxy_connect_timeout 60s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location = /_auth/verify {
        internal;
        proxy_pass http://127.0.0.1:3081/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-DataFoundation-Email "";
        proxy_set_header X-DataFoundation-Name "";
    }

    location ^~ /_auth/ {
        proxy_pass http://127.0.0.1:3081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header X-DataFoundation-Email "";
        proxy_set_header X-DataFoundation-Name "";
        proxy_redirect ~^/$ /review;
    }

    location @email_login {
        return 302 /_auth/login;
    }

    location @dashboard_guest {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"authenticated":false}';
    }

    location = /api/dashboard/session {
        auth_request /_auth/verify;
        error_page 401 = @dashboard_guest;
        auth_request_set $dashboard_email $upstream_http_x_datafoundation_email;
        proxy_pass http://127.0.0.1:8793;
        proxy_set_header Host $host;
        proxy_set_header X-DataFoundation-Email $dashboard_email;
        proxy_set_header X-DataFoundation-Name "";
        proxy_set_header Authorization "";
        add_header Cache-Control "no-store" always;
    }

    location = /api/dashboard {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://127.0.0.1:8793/api/dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-DataFoundation-Email "";
        proxy_set_header X-DataFoundation-Name "";
        proxy_set_header Authorization "";
        add_header Cache-Control "no-store" always;
    }

    location = / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://127.0.0.1:8793/;
        proxy_set_header Host $host;
        proxy_set_header X-DataFoundation-Email "";
        proxy_set_header X-DataFoundation-Name "";
        proxy_set_header Authorization "";
    }

    location ~ ^/static/dashboard\.(css|js)$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://127.0.0.1:8793;
        proxy_set_header Host $host;
        proxy_set_header X-DataFoundation-Email "";
        proxy_set_header X-DataFoundation-Name "";
        proxy_set_header Authorization "";
    }

    location / {
        auth_request /_auth/verify;
        error_page 401 = @email_login;
        auth_request_set $datafoundation_email $upstream_http_x_datafoundation_email;
        auth_request_set $datafoundation_name $upstream_http_x_datafoundation_name;

        proxy_pass http://127.0.0.1:8793/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-DataFoundation-Email $datafoundation_email;
        proxy_set_header X-DataFoundation-Name $datafoundation_name;
        proxy_set_header Authorization "";
        proxy_read_timeout 120s;
    }
}
