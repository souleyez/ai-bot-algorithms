server {
    listen 80;
    server_name card.goods-editor.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 302 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name card.goods-editor.com;

    ssl_certificate /etc/letsencrypt/live/card.goods-editor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/card.goods-editor.com/privkey.pem;

    client_max_body_size 100m;

    location = /_auth/verify {
        internal;
        proxy_pass http://127.0.0.1:3081/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-DataFoundation-Email "";
        proxy_set_header X-DataFoundation-Name "";
    }

    location ^~ /_auth/ {
        proxy_pass http://127.0.0.1:3081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header X-DataFoundation-Email "";
        proxy_set_header X-DataFoundation-Name "";
    }

    location @email_login {
        return 302 /_auth/login;
    }

    location / {
        auth_request /_auth/verify;
        error_page 401 = @email_login;
        auth_request_set $datafoundation_email $upstream_http_x_datafoundation_email;
        auth_request_set $datafoundation_name $upstream_http_x_datafoundation_name;

        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-DataFoundation-Email $datafoundation_email;
        proxy_set_header X-DataFoundation-Name $datafoundation_name;
        proxy_set_header Authorization "";
        proxy_read_timeout 120s;
    }
}

server {
    listen 8792;
    server_name _;

    allow 1.12.246.48;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
